<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy New Year 2026 - For Quynh iu</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;900&family=Dancing+Script:wght@700&family=Patrick+Hand&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        /* --- CẤU HÌNH CHUNG --- */
        body {
            margin: 0; overflow: hidden;
            background: #050505;
            font-family: 'Montserrat', sans-serif;
            height: 100vh; color: white;
            user-select: none; -webkit-tap-highlight-color: transparent;
            transition: background 1.5s ease;
        }

        /* --- SÂN KHẤU & ÁNH SÁNG --- */
        #stage-lights {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60%;
            background: radial-gradient(circle at 20% 100%, rgba(255, 0, 100, 0.2), transparent 40%),
                        radial-gradient(circle at 80% 100%, rgba(0, 100, 255, 0.2), transparent 40%);
            z-index: 2; pointer-events: none;
            animation: lightShift 4s infinite alternate;
        }
        @keyframes lightShift { 0% { opacity: 0.4; } 100% { opacity: 0.7; } }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        canvas { display: block; }

        /* --- MÀN HÌNH BẮT ĐẦU --- */
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            cursor: pointer;
        }
        .start-btn {
            padding: 20px 50px; border: 2px solid gold; color: gold;
            font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px;
            background: transparent; border-radius: 50px;
            animation: pulseBtn 1.5s infinite;
        }
        @keyframes pulseBtn { 0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 215, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); } }

        /* --- UI LỊCH (CALENDAR) --- */
        #calendar-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 280px; height: 320px; z-index: 10;
            perspective: 1000px; display: none;
        }
        .calendar-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; color: #333;
            border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform-origin: top left; 
            background-image: radial-gradient(#e0e0e0 15%, transparent 16%), radial-gradient(#e0e0e0 15%, transparent 16%);
            background-size: 10px 10px; background-position: 0 0, 5px 5px;
            overflow: hidden;
            backface-visibility: hidden;
        }
        .calendar-page::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 40px;
            background: #d63031; border-radius: 10px 10px 0 0;
            border-bottom: 2px dashed rgba(255,255,255,0.5);
        }
        .cal-month { font-size: 1.5rem; margin-top: 40px; font-weight: 300; text-transform: uppercase; }
        .cal-date { font-size: 8rem; font-weight: 900; line-height: 1; color: #2d3436; }
        .cal-year { font-size: 1.2rem; font-weight: 700; color: #d63031; }
        .cal-lunar { font-size: 1.1rem; color: #636e72; margin-top: 5px; font-family: 'Dancing Script', cursive; }

        /* --- STYLE ĐẶC BIỆT --- */
        .calendar-page.special-date {
            background: #b30000;
            border: 2px solid #ffd700;
            background-image: radial-gradient(#d63031 15%, transparent 16%);
        }
        .calendar-page.special-date::before { background: #800000; border-bottom: 2px dashed gold; }
        .calendar-page.special-date .cal-month { color: #ffd700; font-weight: bold; }
        .calendar-page.special-date .cal-date { color: #ffd700; text-shadow: 2px 2px 0px #800000; }
        .calendar-page.special-date .cal-year { color: #fff; opacity: 0.8; }
        .calendar-page.special-date .cal-lunar { color: #fff; font-size: 1.4rem; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        @keyframes tearOff {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(-10deg) skewX(5deg); }
            100% { transform: rotate(60deg) translateY(200px) translateX(400px); opacity: 0; }
        }
        .tearing { animation: tearOff 0.9s ease-in forwards; }

        /* --- UI COUNTDOWN --- */
        #countdown-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; justify-content: center; align-items: center;
            font-size: 15rem; font-weight: 900; color: #fff;
            z-index: 60; 
            text-shadow: 0 0 50px rgba(255,255,255,0.8);
            font-family: 'Montserrat', sans-serif;
            pointer-events: none;
        }
        @keyframes zoomTick { 
            0% { transform: scale(0.5); opacity: 0; } 
            50% { opacity: 1; transform: scale(1.2); } 
            100% { transform: scale(2); opacity: 0; } 
        }

        /* --- UI LÌ XÌ --- */
        #lixi-btn {
            position: absolute; bottom: 20%; left: 50%; transform: translate(-50%, 0);
            padding: 15px 60px; 
            background: linear-gradient(45deg, #c0392b, #d35400);
            border: 2px solid gold; border-radius: 50px; color: #fff; font-weight: 900;
            font-size: 1.5rem; cursor: pointer; z-index: 20;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8), inset 0 0 10px rgba(255,215,0,0.5);
            display: none; 
            animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            transition: transform 0.2s;
        }
        #lixi-btn:active { transform: translate(-50%, 0) scale(0.95); }
        @keyframes popIn { from { transform: translate(-50%, 100px) scale(0); opacity: 0; } to { transform: translate(-50%, 0) scale(1); opacity: 1; } }

        #lixi-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 30;
            display: none; justify-content: center; align-items: center;
            transition: backdrop-filter 1s ease, background 1s ease;
            overflow-y: auto; 
        }
        .envelopes-container {
            display: flex; gap: 30px; perspective: 1000px;
            flex-wrap: wrap; justify-content: center; width: 100%;
            padding-top: 50px;
            padding-bottom: 50px; 
        }
        .envelope-wrapper {
            width: 120px; height: 180px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }
        .envelope-wrapper:hover { transform: translateY(-10px); }

        .env-body {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 85%;
            background: #c0392b; border-radius: 0 0 10px 10px;
            border: 2px solid #b33939; border-top: none;
            z-index: 2; overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .env-body::before { 
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, #a93226 10%, transparent 10%);
            background-size: 20px 20px; opacity: 0.3;
        }
        .env-body .coin-deco {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; color: rgba(255, 215, 0, 0.3); font-weight: 900;
        }
        .env-flap {
            position: absolute; top: 0; left: 0; width: 100%; height: 15%; 
            background: #d63031;
            border-radius: 10px 10px 0 0;
            border: 2px solid #b33939; border-bottom: none;
            transform-origin: bottom;
            z-index: 3;
            transition: transform 0.4s ease-in-out;
            border-bottom: 2px solid gold;
        }
        .env-paper {
            position: absolute; top: 15%; left: 10px; right: 10px; height: 70%;
            background: #fffdf5;
            z-index: 1; 
            border-radius: 5px;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex; justify-content: center; align-items: center;
            font-size: 0.8rem; color: #333; overflow: hidden;
        }
        .envelope-wrapper.active { pointer-events: none; } 
        .envelope-wrapper.active .env-flap { transform: rotateX(180deg); z-index: 0; }
        .envelope-wrapper.active .env-paper { z-index: 10; animation: paperUpAndFlip 1s forwards 0.3s; }
        @keyframes paperUpAndFlip {
            0% { transform: translateY(0) scale(1) rotateY(0); }
            50% { transform: translateY(-120px) scale(1) rotateY(0); } 
            100% { transform: translateY(-200px) scale(3) rotateY(90deg); opacity: 0; } 
        }
        @keyframes flyIn { from { transform: translateY(600px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* POPUP THƯ RESPONSIVE */
        #letter-modal {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) rotateY(90deg); 
            width: 85%; max-width: 600px; max-height: 70vh; 
            overflow-y: auto;
            background: #fffdf5 url('https://www.transparenttextures.com/patterns/cream-paper.png');
            padding: 25px; border-radius: 15px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            font-family: 'Patrick Hand', cursive; 
            font-size: 1.5rem; 
            color: #2c3e50;
            z-index: 40; 
            text-align: center; line-height: 1.5;
            border: 6px double #d63031;
            opacity: 0;
            transition: transform 0.5s ease-out, opacity 0.5s;
        }
        #letter-modal.show-flip { transform: translate(-50%, -50%) rotateY(0deg); opacity: 1; }
        .close-btn {
            margin-top: 20px; padding: 10px 30px; background: #d63031; color: #fff;
            border: none; border-radius: 8px; cursor: pointer; font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(214, 48, 49, 0.4);
            font-family: 'Montserrat', sans-serif;
            display: inline-block;
        }

        /* MÀN HÌNH CUỐI */
        #final-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; pointer-events: none;
        }
        .final-text {
            font-size: 3.5rem; font-weight: 900; color: #fff; text-align: center;
            text-shadow: 0 0 20px #ff0055;
            margin-bottom: 20px;
        }
        .wavy-char { display: inline-block; animation: textWave 2.5s ease-in-out infinite; }
        @keyframes textWave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        #love-message {
            font-family: 'Pacifico', cursive;
            font-size: 4.5rem;
            background: linear-gradient(to right, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 20, 147, 0.6);
            opacity: 0; 
            transform: scale(0.5);
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 20px;
            z-index: 60;
        }
        #love-message.show-love {
            opacity: 1;
            transform: scale(1);
            animation: heartBeat 1.2s infinite alternate;
        }
        @keyframes heartBeat {
            0% { transform: scale(1); text-shadow: 0 0 30px rgba(255, 20, 147, 0.6); }
            100% { transform: scale(1.1); text-shadow: 0 0 60px rgba(255, 0, 100, 1); filter: brightness(1.2); }
        }

        /* --- NÚT BẤM CHUYỂN TRANG --- */
        #redirect-btn {
            margin-top: 40px;
            padding: 15px 40px;
            background: #fff;
            color: #d63031;
            border: 2px solid gold;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            opacity: 0; 
            pointer-events: none;
            transition: opacity 1.5s ease;
            z-index: 100;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        #redirect-btn.show-btn {
            opacity: 1;
            pointer-events: auto;
            animation: pulseBtn 2s infinite; 
        }

        /* --- TRANG CUSTOM MỚI (VẼ TRÁI TIM & TÂM TƯ) --- */
        #my-custom-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 200;
            display: none;
            background: #fffdf5 url('https://www.transparenttextures.com/patterns/rice-paper-2.png'); /* Nền giấy dó */
            flex-direction: column; 
            overflow: hidden;
        }

        #heart-canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            opacity: 1;
            transition: opacity 1.5s ease; 
        }
        #heart-canvas.fade-out {
            opacity: 0;
        }

        /* Nút lật trang trong phần nhật ký - MỚI */
        #next-page-btn {
            position: absolute;
            bottom: 30px; 
            right: 30px;
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #d63031;
            font-family: 'Patrick Hand', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 210;
            display: none; /* Mặc định ẩn */
            transition: transform 0.3s;
            border-bottom: 2px dashed #d63031;
        }
        #next-page-btn:hover {
            transform: translateX(5px) scale(1.1);
            color: #c0392b;
        }
        
        /* Hiệu ứng chuyển trang cho Canvas */
        .page-transition {
            animation: fadePage 1s ease-in-out;
        }
        @keyframes fadePage {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        /* ----------------------------------------------------------- */

        .floating-icon { 
            position: absolute; font-size: 2rem; pointer-events: none; z-index: 55;
            animation: floatAround 3s ease-out forwards;
        }
        .final-icon {
            position: absolute; font-size: 2.5rem;
            animation: floatIconFinal 4s infinite ease-in-out;
            opacity: 0; z-index: 52;
        }
        @keyframes floatAround {
            0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
            20% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1.2); }
            100% { transform: translate(var(--tx-end), var(--ty-end)) scale(0); opacity: 0; }
        }
        @keyframes floatIconFinal { 
            0% { transform: translateY(100px) rotate(0deg); opacity: 0; } 
            20% { opacity: 1; } 80% { opacity: 1; }
            100% { transform: translateY(-200px) rotate(20deg); opacity: 0; } 
        }

        @media (max-width: 480px) {
            #letter-modal { width: 90%; font-size: 1.3rem; padding: 15px; }
            .start-btn { font-size: 1.2rem; padding: 15px 30px; }
            .envelope-wrapper { width: 100px; height: 150px; }
            .final-text { font-size: 2.2rem !important; } 
            #love-message { font-size: 3rem !important; }
        }

        #bg-music { position: absolute; width: 1px; height: 1px; opacity: 0; z-index: -1; pointer-events: none; }
    </style>
</head>
<body>
    <audio id="bg-music" playsinline style="display:none">
        <source src="intro.mp4" type="audio/mp4">
        <source src="intro.mp3" type="audio/mpeg">
    </audio>

    <div id="start-overlay">
        <button class="start-btn" onclick="startExperience()">Chạm vào đây nèee🧧</button>
    </div>

    <div id="stage-lights"></div>
    <div id="canvas-container"><canvas id="canvas"></canvas></div>

    <div id="calendar-container"></div>
    
    <div id="countdown-container"></div>

    <button id="lixi-btn">Nhận Lì Xì Nè 🧧</button>
    <div id="lixi-overlay">
        <div class="envelopes-container" id="env-container"></div>
    </div>

    <div id="letter-modal">
        <div id="letter-content"></div>
        <button class="close-btn" onclick="closeLetter()">Đóng lại</button>
    </div>

    <div id="final-screen">
        <div class="final-text">HAPPY NEW YEAR<br>QUỲNH <span style="color:red">♥</span></div>
        <div id="love-message">love you❤️</div>
        
        <button id="redirect-btn" onclick="goToNextPage()">Xem tiếp bất ngờ nha 🎁</button>
    </div>

    <div id="my-custom-page">
        <canvas id="heart-canvas"></canvas>
        <button id="next-page-btn" onclick="nextDiaryPage()">Xem tiếp trang sau ➡</button>
    </div>

    <script>
        // --- DATA ---
        const DATES = [
            { d: 28, m: 12, y: 2025, l: "..." },
            { d: 29, m: 12, y: 2025, l: "Đêm Giao Thừa" },
            { d: "01", m: "01", y: 2026, l: "Tết Nguyên Đán" }
        ];

        const LETTERS = [
            "🧧 Gửi yêu thương của tou năm 2026 Chúc Quỳnh một năm mới tràn đầy niềm vui,sức khỏe và những điều may mắn,lun xinh đẹp và dthw :3.Năm mới không chỉ là khởi đầu cho một hành trình mới mà còn là 1 cơ hội để người nhìn lại những khoảnh khắc đã trôi qua, trân trọng những gì Quỳnhh đã trải qua",
            "🎆 Cùng vượt qua khó khăn,không ngừng phát triển và đặt mục tiêu mà bản thân đề ra để giúp bản thân ngày càng tốt hơn.Hy vọng rằng Quình sẽ biết để ý bản thân mình hơn,giữ một trái tim kiên cường và tâm hồn lạc quan hong phải khócc vì những thứ không đáng. Nếu có khóc thì có tui ở đây dỗ, trêu cho cười:)))))",
            "🚀 Cuộc sống không phải lúc nào cũng suôn sẻ,đôi lúc không như cau mong muốn và lm Quình bùn,nhưng mà hãy nhớ là mỗi thử thách hay thất bại là một bước đệm để cau dần trưởng thành hơn.Lun giữ được sự tích cực và nụ cười trên môi nhá vì nó dthw=))).Năm mới chúc Quỳnh luôn thành công và đạt được điều mà Quỳnh mong muốn, được đỗ vào c3 mong muốn và được trở thành một tiep vienn như Quỳnh yeu thichh, dù chặng đường có khó hay đầy trở ngại thì cũng đừng bỏ cuộc nhé.Hải lun ở đây cổ vũ,tiếp sức cho Quỳnh",
            "🥰 Chúc cô nàng:)) có năm mới ngập trànnnn niềm zui,lun biec yêu thw và để ý bản thân của mìnn và trân trọng hơnn . Một năm mới tuyệt zờii đang chờ ở phía trước đóo, nên là nhớ là hãy bỏ đi tất cả những muộn phiền của năm cũ và đón một năm mới thật là zuiiii <3",
            "🥳 Qua năm cũng sắp tới chặng đường lên cấp 3 ròi,cùng nhau gánggg học thật giỏii, lun đạt điểm cao, đạt được điều mong ước trong năm học. Cảm ơn vì đã ở đây với bao sự rời đi của những người khác.Cảm ơn nhìu vì vẫn ở đây dù đôi lúc Hải gây ra nhiều phiền phức hay khó chịu mà cô nương zẫn ở đayy zới tui,toii gấc biết ơnnn vàa rấtt trân trọng những khoảnh khắc đẹp nàyyyyy .Cảm ơn rấttt rấttttttt nhiềuuuuuu,tiếp tục đi tiếp con đường sắp tới nhóoo,  iu💗",
            "💌 Cuối cùng nè, lì xì này chứa đựng niềm tin của tớ dành cho cậu. Chúc Quỳnh năm 2026 sẽ là năm rực rỡ nhất, cười nhiều hơn và bớt suy nghĩ linh tinh đi nhé. Dù thế nào thì tớ vẫn luôn ở đây. Happy New Year! ❤️"
        ];
        
        // --- AUDIO ---
        const AudioSys = {
            ctx: null,
            init() { 
                if(!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)(); 
                    const buffer = this.ctx.createBuffer(1, 1, 22050);
                    const source = this.ctx.createBufferSource();
                    source.buffer = buffer; source.connect(this.ctx.destination);
                    source.start(0);
                }
            },
            play(type) {
                if(!this.ctx) return;
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                if (type === 'launch') {
                    osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(600, t + 0.8);
                    gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t + 0.8);
                } else if (type === 'boom') {
                    osc.frequency.setValueAtTime(120, t); osc.frequency.exponentialRampToValueAtTime(10, t + 0.5);
                    gain.gain.setValueAtTime(1.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
                } else if (type === 'crackle') { 
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(500, t);
                    osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
                    gain.gain.setValueAtTime(0.2, t);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                }
                
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(t); osc.stop(t + 2);
            }
        };

        function startExperience() {
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('calendar-container').style.display = 'block';
            AudioSys.init();
            
            const music = document.getElementById('bg-music');
            music.volume = 1.0;
            music.play().catch(e => console.log("Lỗi phát nhạc:", e));

            music.onended = function() {
                if (this.currentSrc.includes("intro.mp4") || this.src.includes("intro.mp4")) {
                    console.log("Hết intro, chuyển bài main...");

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let w, h; const r = (min, max) => Math.random() * (max - min) + min;

        // --- CALENDAR LOGIC ---
        const calContainer = document.getElementById('calendar-container');

        // --- COUNTDOWN LOGIC ---
        function startCountdown() {
            calContainer.style.display = 'none';
            const countDiv = document.getElementById('countdown-container');
            countDiv.style.display = 'flex';
            let count = 3;

            const music = document.getElementById('bg-music');
            if(music.paused) music.play().catch(e => console.log(e));

            function tick() {
                if(count > 0) {
                    countDiv.innerText = count;

        // --- HỆ THỐNG PHÁO HOA ---
        const PHY = { g: 0.05, drag: 0.96 };
        let rockets = [], particles = [], fountains = [], drones = [];
        let showState = 'IDLE';

        class Particle {
            constructor(x, y, hue, vx, vy, type, generation = 1) {
                this.x = x; this.y = y; this.hue = hue;
                this.vx = vx; this.vy = vy;
                this.type = type || 'spark';
                this.generation = generation;
                this.alpha = 1;
                this.life = r(100, 200);
                this.decay = type === 'sub_shell' ? r(0.005, 0.01) : r(0.008, 0.015);
                
                if (this.type === 'smoke') { 
                    this.life = r(30, 60); this.decay = r(0.01, 0.03); this.size = r(2, 5); 
                } 
                if (this.type === 'sub_shell') {
                    this.vy += 1; 
                }
            }

            update() {
                this.vx *= PHY.drag; this.vy *= PHY.drag; 
                if (this.type === 'smoke') { 
                    this.vy -= 0.02; this.x += Math.sin(this.life * 0.1) * 0.5; this.size *= 1.02; 
                } 
                else { this.vy += PHY.g; }
                
                this.x += this.vx; this.y += this.vy;
                this.alpha -= this.decay;
                
                if(this.type === 'spark' && Math.random() < 0.1) this.alpha = Math.random(); 
                
                if (this.type === 'sub_shell' && this.life <= 0) { 
                    this.explodeSecondTime(); 
                    this.alpha = 0; 
                }
                this.life--;
            }

            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save(); ctx.globalAlpha = this.alpha;
                if (this.type === 'smoke') {
                    ctx.fillStyle = `rgba(150, 150, 150, ${this.alpha})`;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.alpha})`;
                    let size = (this.type === 'core' ? 3 : (this.type==='sub_shell'? 3 : 1.5));
                    ctx.beginPath(); ctx.arc(this.x, this.y, size, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }

            explodeSecondTime() {
                if(Math.random() < 0.5) AudioSys.play('crackle');
                const count = r(20, 30); 
                for (let i = 0; i < count; i++) {
                    const angle = r(0, Math.PI * 2); 
                    const speed = r(1, 5);
                    const newHue = (Math.random() < 0.5) ? this.hue : r(0, 360);
                    particles.push(new Particle(this.x, this.y, newHue, Math.cos(angle)*speed, Math.sin(angle)*speed, 'spark', this.generation + 1));
                }
            }
        }

        class Rocket {
            constructor(x, targetY) {
                this.x = x; this.y = h; this.targetY = targetY;
                this.vx = 0; this.vy = -Math.sqrt(2 * PHY.g * (h - targetY)); 
                this.hue = r(0, 360);
                AudioSys.play('launch');
            }
            update() {
                this.x += this.vx; this.y += this.vy; this.vy += PHY.g;
                if (this.vy >= 0) { this.explode(); return false; }
                return true;
            }
            draw(ctx) {
                ctx.save(); ctx.strokeStyle = `hsl(${this.hue}, 100%, 50%)`; ctx.lineWidth = 2; 
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x, this.y + 15); ctx.stroke(); ctx.restore();
            }
            explode() {
                AudioSys.play('boom');
                const shapeType = Math.random();
                const cx = this.x; const cy = this.y; const hue = this.hue;
                
                for(let k=0; k<15; k++) particles.push(new Particle(cx, cy, 0, r(-2,2), r(-2,2), 'smoke'));

                if (shapeType < 0.4) { 
                    for (let i = 0; i < 40; i++) {
                        const angle = r(0, Math.PI * 2); const speed = r(3, 8);
                        const p = new Particle(cx, cy, hue, Math.cos(angle)*speed, Math.sin(angle)*speed, 'sub_shell');
                        p.life = r(30, 50); 
                        particles.push(p);
                    }
                    for (let i = 0; i < 20; i++) {
                        const angle = r(0, Math.PI * 2); const speed = r(1, 4);
                        particles.push(new Particle(cx, cy, hue, Math.cos(angle)*speed, Math.sin(angle)*speed, 'core'));
                    }
                }
                else if (shapeType < 0.6) { 
                    const points = 5; const steps = points * 2;
                    for (let i = 0; i < 60; i++) {
                        const angle = (Math.PI * 2 / steps) * (i % steps); 
                        const isOuter = (i % 2 === 0);
                        const v = (isOuter ? 6 : 3) + r(-0.5, 0.5); 
                        particles.push(new Particle(cx, cy, hue, Math.cos(angle - Math.PI/2) * v, Math.sin(angle - Math.PI/2) * v, 'core'));
                    }
                }
                else { 
                    for (let i = 0; i < 100; i++) {
                        const angle = r(0, Math.PI * 2); const speed = r(1, 8);
                        particles.push(new Particle(cx, cy, hue, Math.cos(angle)*speed, Math.sin(angle)*speed, 'spark'));
                    }
                }
            }
        }

        class Fountain {
            constructor(x) { this.x = x; this.y = h; this.timer = 0; }
            update() {
                this.timer++;
                if (this.timer % 3 === 0) {
                    const angle = -Math.PI/2 + (Math.random() - 0.5) * 0.4;
                    const speed = r(8, 14);
                    const c = 40 + Math.random()*20; 
                    particles.push(new Particle(this.x, this.y, c, Math.cos(angle)*speed*0.5, Math.sin(angle)*speed, 'spark'));
                }
            }
        }

        class Drone {
            constructor() {
                this.x = Math.random() * w; this.y = Math.random() * h;
                this.tx = this.x; this.ty = this.y;
                this.color = '#fff';
            }
            update() { this.x += (this.tx - this.x) * 0.08; this.y += (this.ty - this.y) * 0.08; }
            draw(ctx) { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI*2); ctx.fill(); }
        }

        // --- TEXT TO POINTS LOGIC ---
        function getPointsFromMultiLineText(textArray, scale, colorMode) {
            const tCanvas = document.createElement('canvas'); const tCtx = tCanvas.getContext('2d');
            const lineHeight = 100;
            tCanvas.width = 600; tCanvas.height = textArray.length * lineHeight + 100;
            tCtx.font = "900 80px Montserrat"; tCtx.textAlign = "center"; tCtx.textBaseline = "middle";
            tCtx.fillStyle = "#fff";
            
            for (let i = 0; i < textArray.length; i++) {
                tCtx.fillText(textArray[i], 300, (i + 1) * lineHeight);
            }

            const pData = tCtx.getImageData(0,0,600, tCanvas.height).data;
            let points = [];
            for(let y=0; y<tCanvas.height; y+=4) for(let x=0; x<600; x+=4) {
                if (pData[(y*600+x)*4 + 3] > 128) {
                    let c = "#fff";
                    if(colorMode === 'rainbow') {
                        c = `hsl(${(x/600)*360}, 100%, 60%)`;
                    } else if (colorMode === 'love') {
                        const percent = x/600;
                        c = `hsl(${330 + percent*30}, 100%, 60%)`;
                    } else {
                        c = colorMode;
                    }
                    points.push({x: (x - 300) * scale + w/2, y: (y - tCanvas.height/2) * scale + h/2, c: c});
                }
            }
            return points;
        }

        function getHeartPoints() {
            let points = [];
            for (let t = 0; t < Math.PI * 2; t += 0.05) {
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                points.push({ x: x * 15 + w/2, y: y * 15 + h/2 - 50, c: '#ff0055' });
            }
            return points;
        }

        function getPeachBlossomPoints() {
            let points = [];
            for(let i=0; i<100; i++) {
                let t = i/100;
                let x = (1-t)*(1-t)*(w*0.3) + 2*(1-t)*t*(w*0.5) + t*t*(w*0.8);
                let y = (1-t)*(1-t)*(h*0.8) + 2*(1-t)*t*(h*0.7) + t*t*(h*0.3);
                points.push({x: x, y: y, c: '#5d4037'});
            }
            const flowers = [ {x: 0.35, y: 0.75}, {x: 0.5, y: 0.6}, {x: 0.65, y: 0.45}, {x: 0.75, y: 0.35}, {x: 0.55, y: 0.5} ];
            flowers.forEach(fl => {
                let cx = w * fl.x; let cy = h * fl.y;
                for(let j=0; j<5; j++) {
                    let angle = (Math.PI*2/5)*j;
                    let petalX = cx + Math.cos(angle)*15;
                    let petalY = cy + Math.sin(angle)*15;
                    for(let k=0; k<10; k++) { points.push({ x: petalX + (Math.random()-0.5)*10, y: petalY + (Math.random()-0.5)*10, c: '#ff9ff3' }); }
                }
                for(let k=0; k<5; k++) points.push({x: cx + r(-3,3), y: cy + r(-3,3), c: 'gold'});
            });
            return points;
        }

        function formShape(points) {
            if (drones.length < points.length) for(let i=0; i<points.length - drones.length; i++) drones.push(new Drone());
            else if (drones.length > points.length) drones.splice(points.length);
            for(let i=0; i<points.length; i++) { drones[i].tx = points[i].x; drones[i].ty = points[i].y; drones[i].color = points[i].c; }
        }

        function spawnIconsAroundCenter() {
            const container = document.body;
            const icons = ['❤️', '✨', '⭐', '💖', '💕', '🌟'];

        // --- MAIN LOOP ---
        let startTime = 0;
        let lastRocketTime = 0;
        let salvoCount = 0;
        let lastSalvoTime = 0;

        function loop() {
            requestAnimationFrame(loop);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; ctx.fillRect(0, 0, w, h);

            if (showState === 'FIREWORKS') {
                const now = Date.now();
                const elapsed = now - startTime;

                if (fountains.length === 0) fountains.push(new Fountain(50), new Fountain(w - 50));
                fountains.forEach(f => f.update());

                if (salvoCount < 3) {
                    if (now - lastSalvoTime > 2000) { 
                        rockets.push(new Rocket(w * 0.2, h * 0.2));
                        rockets.push(new Rocket(w * 0.5, h * 0.2));
                        rockets.push(new Rocket(w * 0.8, h * 0.2));
                        salvoCount++;
                        lastSalvoTime = now;
                    }
                }
                else if (elapsed < 30000) {
                    if (now - lastRocketTime > 500) {
                        rockets.push(new Rocket(Math.random() * w, h*0.1 + Math.random()*h*0.4));
                        lastRocketTime = now;
                    }
                }
                else {
                    showState = 'DRONE_1';
                    fountains = [];
                }
            }
            else if (showState === 'DRONE_1') {
                formShape(getPointsFromMultiLineText(["HAPPY", "NEW YEAR"], (w<500?0.6:1.2), "rainbow"));
                setTimeout(() => { if(showState === 'DRONE_1') showState = 'DRONE_2'; }, 5000);
            }
            else if (showState === 'DRONE_2') {
                formShape(getPointsFromMultiLineText(["QUỲNH"], (w<500?1.0:2.0), "love"));
                if(Math.random() < 0.4) spawnIconsAroundCenter(); 
                setTimeout(() => { if(showState === 'DRONE_2') showState = 'DRONE_3'; }, 6000);
            }
            else if (showState === 'DRONE_3') {
                formShape(getPeachBlossomPoints());
                setTimeout(() => { if(showState === 'DRONE_3') showState = 'DRONE_4'; }, 5000);
            }
            else if (showState === 'DRONE_4') {
                formShape(getHeartPoints());
                document.getElementById('lixi-btn').style.display = 'block';
            }

            rockets = rockets.filter(r => { r.draw(ctx); return r.update(); });
            particles = particles.filter(p => { p.draw(ctx); p.update(); return p.life > 0; });
            drones.forEach(d => { d.update(); d.draw(ctx); });
        }

        function startFireworksShow() {
            calContainer.style.display = 'none';
            startTime = Date.now();
            showState = 'FIREWORKS';
            loop();
        }

        const PAGE_CONTENT_2 = "Cũng chả biết từ khi nào nữa, Hải đã thích Quỳnh. Không phải kiểu rung động ồn ào hay một khoảnh khắc rõ ràng để nhớ, chỉ là dần dần thấy Quỳnh quan trọng hơn, để ý nhiều hơn những điều rất nhỏ. Có lúc Hải cũng vụng về, không biết nói sao cho đúng, nên chọn cách im lặng và ở cạnh theo cách an toàn nhất. Thích Quỳnh theo cách nhẹ nhàng, không đòi hỏi, không mong phải được đáp lại ngay, chỉ mong trong quãng thời gian mình còn đi chung nửa chặng đường này, mọi thứ vẫn giữ được sự ấm áp và chân thành như bây giờ. Nếu sau này có lúc nhìn lại, Hải chỉ hy vọng Quỳnh nhớ rằng đã từng có một người thương Quỳnh rất thật, theo cách chậm và hiền như thế.Rồi từ lúc nào đó, cảm giác ấy không còn là thích nữa, mà chậm rãi thành yêu, rồi dần thành thương. Thương theo cách rất hiền, không ồn ào, chỉ là muốn ở bên cạnh Quỳnh lâu hơn một chút, muốn cùng đi qua thêm nhiều ngày bình thường như thế này. Có những lúc Hải không nói gì, không làm gì đặc biệt, nhưng trong lòng luôn nghĩ nếu được ở cạnh Quỳnh thêm một đoạn đường nữa thì cũng đã đủ ấm. Không mong hứa hẹn xa xôi, chỉ mong hiện tại này kéo dài hơn một chút, để sự quan tâm, sự chân thành có thêm thời gian mà lớn lên.";
        
        const PAGE_CONTENT_3 = "Tớ xin lỗi vì đã chọn cách vòng vo như thế này, xin lỗi vì không đủ dũng khí để nói thẳng với cậu bằng lời của chính mình. Có lẽ vì tớ sợ, sợ rằng chỉ cần nói ra thôi, mối quan hệ mà tớ luôn trân trọng sẽ không còn giữ được sự tự nhiên vốn có. Tớ đã nhiều lần muốn nói, muốn hỏi, muốn bước thêm một chút về phía cậu, nhưng mỗi lần như vậy, tớ lại tự dừng mình lại, vì tớ không muốn trở thành gánh nặng trong cuộc sống của cậu. “In Love” của Low G là những rung động rất thật của tớ, là lúc tớ nhận ra mình quan tâm cậu nhiều hơn một người bạn, là những khoảnh khắc rất nhỏ thôi cũng đủ làm tớ vui, đủ để tớ mong chờ. Còn “Có Đôi Điều” của skiki là phần lặng nhất trong tớ, là những điều tớ cất đi, là sự im lặng kéo dài, là việc tớ chọn ở lại phía sau vì không muốn làm cậu khó xử. Hai bài hát ấy không phải ngẫu nhiên tớ gửi cho cậu, chúng là hai phần cảm xúc trong cùng một con người, vừa yêu thương, vừa sợ hãi, vừa muốn nói ra, vừa không dám đánh mất. Nếu có lúc nào đó cậu nghe và thấy lòng mình chùng xuống, mong cậu hiểu rằng đã từng có một người thương cậu rất nhiều, thương theo cách vụng về, lặng lẽ, không cần được đáp lại, chỉ mong cậu luôn bình yên, dù sau này người ở cạnh cậu có là ai đi nữa.";
        
        const FINAL_SIGNATURE = "- From Hải with love -";
        
        const DIARY_PAGES = [PAGE_CONTENT_1, PAGE_CONTENT_2, PAGE_CONTENT_3];
        let currentPageIndex = 0;

        function goToNextPage() {
            document.getElementById('final-screen').style.display = 'none';
            const customPage = document.getElementById('my-custom-page');
            customPage.style.display = 'flex';
            
            showState = 'IDLE'; 
            setTimeout(initInkHeart, 500);
        }

        // --- 1. VẼ TRÁI TIM BAN ĐẦU ---
        function initInkHeart() {
            const c = document.getElementById('heart-canvas');
            const ctx = c.getContext('2d');
            
            c.width = window.innerWidth;
            c.height = window.innerHeight;
            
            const cx = c.width / 2;
            const cy = c.height / 2;
            
            let t = 0;
            const speed = 0.025; 
            const scale = Math.min(c.width, c.height) / 35; 
            
            function getHeartXY(val) {
                let x = 16 * Math.pow(Math.sin(val), 3);
                let y = -(13 * Math.cos(val) - 5 * Math.cos(2*val) - 2 * Math.cos(3*val) - Math.cos(4*val));
                return { x: cx + x * scale, y: cy + y * scale };
            }

            function draw() {
                if (t > Math.PI * 2) {
                    c.classList.add('fade-out'); // Biến mất trái tim
                    setTimeout(() => {
                         ctx.clearRect(0, 0, c.width, c.height);
                         c.classList.remove('fade-out'); 
                         // Bắt đầu vào Trang 1
                         currentPageIndex = 0;
                         renderDiaryPage(currentPageIndex);
                    }, 1500);
                    return; 
                }

                for (let i = 0; i < 3; i++) { 
                    t += speed / 5;
                    if (t > Math.PI * 2) break;
                    const point = getHeartXY(t);
                    const radius = (Math.random() * 10 + 5) * (1 + Math.sin(t * 5) * 0.2); 
                    ctx.globalAlpha = Math.random() * 0.3 + 0.1; 
                    ctx.fillStyle = `hsl(${350 + Math.random()*20}, 80%, ${40 + Math.random()*20}%)`;
                    ctx.beginPath();
                    ctx.arc(point.x + (Math.random()-0.5)*5, point.y + (Math.random()-0.5)*5, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            draw();
        }

        // --- 2. HÀM XỬ LÝ CHUYỂN TRANG ---
        function nextDiaryPage() {
            // Ẩn nút
            document.getElementById('next-page-btn').style.display = 'none';
            currentPageIndex++;
            
            const c = document.getElementById('heart-canvas');
            // Hiệu ứng mờ đi để chuyển trang
            c.style.opacity = 0;
            
            setTimeout(() => {
                const ctx = c.getContext('2d');
                ctx.clearRect(0, 0, c.width, c.height); // Xóa trắng
                renderDiaryPage(currentPageIndex); // Vẽ trang mới
                c.style.opacity = 1; // Hiện lại
            }, 500);
        }

        // --- 3. HỆ THỐNG KẺ DÒNG & VIẾT CHỮ (ĐƯỢC GỌI MỖI TRANG) ---
        function renderDiaryPage(pageIndex) {
            const c = document.getElementById('heart-canvas');
            const ctx = c.getContext('2d');
            const cW = c.width; 
            const cH = c.height;

            const lineHeight = 50; 
            const startY = cH * 0.15; 
            const maxWidth = cW * 0.9;
            const startX = (cW - maxWidth) / 2;
            const endX = startX + maxWidth;
            
            const numLines = Math.floor((cH * 0.7) / lineHeight);
            
            // A. VẼ DÒNG KẺ
            let currentLineIndex = 0;
            let currentLineX = startX;
            const lineDrawSpeed = 25; // Tăng tốc độ kẻ dòng một chút

            ctx.lineWidth = 1;
            ctx.strokeStyle = "rgba(50, 50, 50, 0.2)"; 
            ctx.lineCap = "round";

            function animateLines() {
                if (currentLineIndex >= numLines) {
                    // Kẻ xong dòng thì viết chữ tương ứng với pageIndex
                    setTimeout(() => startWritingText(ctx, startX, endX, startY, lineHeight, DIARY_PAGES[pageIndex]), 300);
                    return;
                }

                ctx.beginPath();
                ctx.moveTo(currentLineX, startY + currentLineIndex * lineHeight);
                currentLineX += lineDrawSpeed;
                
                if (currentLineX < endX) {
                     ctx.lineTo(currentLineX, startY + currentLineIndex * lineHeight);
                     ctx.stroke();
                     requestAnimationFrame(animateLines);
                } else {
                    ctx.lineTo(endX, startY + currentLineIndex * lineHeight);
                    ctx.stroke();
                    currentLineIndex++;
                    currentLineX = startX;
                    requestAnimationFrame(animateLines);
                }
            }
            animateLines();
        }

        function startWritingText(ctx, startX, endX, startY, lineHeight, textContent) {
            const fontSize = Math.min(30, window.innerWidth / 15);
            ctx.font = `${fontSize}px 'Patrick Hand', cursive`;
            ctx.fillStyle = "#2c3e50";
            ctx.textBaseline = "bottom";

            // Tách chữ để xuống dòng
            const words = textContent.split(' ');
            let lines = [];
            let currentLine = words[0];

            for (let i = 1; i < words.length; i++) {
                let word = words[i];
                let width = ctx.measureText(currentLine + " " + word).width;
                if (width < (endX - startX)) {
                    currentLine += " " + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);

            // Bắt đầu gõ
            let lineIdx = 0;
            let charIdx = 0;
            let cursorX = startX;
            let cursorY = startY + lineHeight;

            function typeWriter() {
                if (lineIdx < lines.length) {
                    const currentString = lines[lineIdx];
                    if (charIdx < currentString.length) {
                        const char = currentString[charIdx];
                        ctx.fillText(char, cursorX, cursorY - 5);
                        cursorX += ctx.measureText(char).width;
                        charIdx++;
                        setTimeout(typeWriter, Math.random() * 30 + 30); // Tốc độ gõ
                    } else {
                        lineIdx++;
                        charIdx = 0;
                        cursorX = startX;
                        cursorY += lineHeight;
                        setTimeout(typeWriter, 300);
                    }
                } else {
                    // KHI VIẾT XONG TRANG NÀY
                    handlePageFinished(ctx, startX, endX, cursorY, lineHeight, fontSize);
                }
            }
            typeWriter();
        }

        function handlePageFinished(ctx, startX, endX, lastY, lineHeight, fontSize) {
            // Kiểm tra xem còn trang không
            if (currentPageIndex < DIARY_PAGES.length - 1) {
                // Chưa hết -> Hiện nút chuyển trang
                const btn = document.getElementById('next-page-btn');
                btn.style.display = 'block';
                btn.classList.add('pulse-btn'); 
            } else {
                // Đã là trang cuối -> Ký tên
                setTimeout(() => drawSignature(ctx, startX, endX, lastY, lineHeight, fontSize), 500);
            }
        }

        function drawSignature(ctx, startX, endX, lastY, lineHeight, fontSize) {
            ctx.font = `${fontSize * 1.5}px 'Dancing Script', cursive`;
            ctx.fillStyle = "#c0392b";
            const sigWidth = ctx.measureText(FINAL_SIGNATURE).width;
            let sigX = (startX + endX) / 2 - sigWidth / 2;
            let sigY = lastY + lineHeight * 2;
            
            let sIdx = 0;
            function typeSig() {
                if (sIdx < FINAL_SIGNATURE.length) {
                    ctx.fillText(FINAL_SIGNATURE[sIdx], sigX, sigY);
                    sigX += ctx.measureText(FINAL_SIGNATURE[sIdx]).width;
                    sIdx++;
                    setTimeout(typeSig, 70);
                }
            }
            typeSig();
        }
    </script>
